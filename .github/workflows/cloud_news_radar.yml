name: Cloud News Radar & Causal Catalyst Engine

on:
  schedule:
    # Every 15 minutes during NSE trading hours (08:30 AM - 04:00 PM IST / 03:00 - 10:30 UTC), Mon-Fri
    - cron: "*/15 3-10 * * 1-5"
    # Hourly during off-market hours and weekends
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-news-radar:
    name: Parallel 8-Thread RSS & Causal Catalyst Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Parallel News & Causal Catalyst Worker
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          INTERNAL_SYNC_TOKEN: ${{ secrets.INTERNAL_SYNC_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/cloud_worker.py --mode news
