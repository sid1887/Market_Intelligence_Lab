name: Cloud News Radar & Causal Catalyst Engine

on:
  schedule:
    # 24/7 autonomous news, corporate disclosures & causal anomaly radar (every 15 minutes)
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-news-radar:
    name: Parallel 8-Thread RSS & Causal Catalyst Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Fast Worker Dependencies
        run: |
          pip install -r requirements-worker.txt

      - name: Execute Parallel News & Causal Catalyst Worker
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL || secrets.RENDER_BACKEND_URL }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_API_URL || secrets.RENDER_BACKEND_URL }}
          MIL_INTERNAL_SYNC_SECRET: ${{ secrets.MIL_INTERNAL_SYNC_SECRET || secrets.INTERNAL_SYNC_TOKEN }}
          INTERNAL_SYNC_TOKEN: ${{ secrets.MIL_INTERNAL_SYNC_SECRET || secrets.INTERNAL_SYNC_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/cloud_worker.py --mode news
