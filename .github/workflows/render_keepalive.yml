name: Render Backend Keep-Alive (24/7 Zero Spin-Down)

on:
  schedule:
    # Every 10 minutes, 24/7/365 to prevent Render free instance spin-down (< 750 free hours/month)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    name: Ping Render Free Instance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping MIL Quant Backend Health Endpoint
        env:
          CUSTOM_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          BASE_URL="${CUSTOM_BACKEND_URL:-https://mil-quant-backend.onrender.com}"
          BASE_URL="${BASE_URL%/}"
          TARGET_URL="${BASE_URL}/api/v1/health"
          echo "Pinging Render backend at: $TARGET_URL"
          START_TIME=$(date +%s%N)
          HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" --max-time 30 "$TARGET_URL")
          END_TIME=$(date +%s%N)
          LATENCY_MS=$(( (END_TIME - START_TIME) / 1000000 ))

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Latency: ${LATENCY_MS}ms"
          cat /tmp/health_response.json || true
          echo ""

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Render instance ping failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✓ Render backend is active and warm."
