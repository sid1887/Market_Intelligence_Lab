[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intelligence-lab"
version = "0.3.0"
description = "Local-First Quantitative Market Research & Adaptive Learning Engine for Indian Equities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Market Intelligence Lab Team"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "matplotlib>=3.6.0,<4.0.0",
    "reportlab>=4.0.0,<6.0.0",
    "mcp>=1.0.0",
    "yfinance>=0.2.38",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",
]
llm = [
    "openai>=1.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
