name: Walk-Forward ML Tournament & Alpha Forecast Precomputation

on:
  schedule:
    # Twice on weekdays: 12:30 IST mid-session (07:00 UTC) + 16:30 IST EOD settlement (11:00 UTC)
    - cron: "0 7,11 * * 1-5"
    # Sunday evening full-horizon retrain at 18:00 IST (12:30 UTC)
    - cron: "30 12 * * 0"
  workflow_dispatch:

concurrency:
  group: mil-ml-tournament
  cancel-in-progress: true

jobs:
  run-ml-tournament:
    name: 7GB Cloud Runner Walk-Forward ML Tournament
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Fast Worker Dependencies
        run: |
          pip install -r requirements-worker.txt

      - name: Execute Walk-Forward ML Tournament & 300-Stock Precomputation
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL || secrets.RENDER_BACKEND_URL }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_API_URL || secrets.RENDER_BACKEND_URL }}
          MIL_INTERNAL_SYNC_SECRET: ${{ secrets.MIL_INTERNAL_SYNC_SECRET || secrets.INTERNAL_SYNC_TOKEN }}
          INTERNAL_SYNC_TOKEN: ${{ secrets.MIL_INTERNAL_SYNC_SECRET || secrets.INTERNAL_SYNC_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/cloud_worker.py --mode ml

      - name: Execute Phase 10 Multi-Modal CPCV Tournament & DSR Gating
        run: |
          python scripts/run_phase3_tournament.py --horizon 20 --n-splits 6 --n-test-splits 2 --feature-set alpha_v3_multimodal
          python -c '
          import json
          with open("data/models/tournament_summary.json") as f:
              data = json.load(f)
          verdict = data.get("promotion_verdict", "UNKNOWN")
          print(f"[CI-GATE] Model Promotion Verdict: {verdict}")
          if verdict == "REJECTED_BELOW_BASELINE":
              print("[CI-GATE] Machine candidates failed to exceed 0.4322 Net Sharpe baseline. Safe fallback to Deterministic Quality-Momentum baseline enforced.")
          '

      - name: Run Production Container Memory & Runtime Benchmark
        run: |
          python scripts/benchmark_runtime.py

      - name: Upload Tournament & Benchmark Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mil-tournament-and-benchmark-reports
          path: |
            data/models/tournament_summary.json
            data/benchmark_results.json
          retention-days: 30

      - name: Commit & Push Refreshed Cloud Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive/bhavcopy_10y.milz data/cloud_seed_snapshot.json.gz data/models/tournament_summary.json data/models/precomputed_forecasts.json data/benchmark_results.json data/models/*.joblib data/models/*.pkl models/registry/*.pkl models/registry/*.joblib 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore(data): autonomous EOD market & ML snapshot sync [skip ci]" && git push)
