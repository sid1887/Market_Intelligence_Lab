name: MIL Continuous Integration & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: mil-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Python 3.13 Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements-worker.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Core Test Suites
        run: |
          PYTHONPATH=. python -m pytest tests/test_truth_invariants.py tests/test_point_in_time_ttm.py tests/test_fee_engine.py tests/test_portfolio_backtester.py tests/test_milestone_b6_3_api.py tests/test_log_engine.py tests/test_phase5_hardening.py tests/test_phase6_ui_endpoints.py tests/test_phase7_flow_and_pead.py tests/test_phase8_hmm_and_conformal.py tests/test_phase9_spillover_and_policy.py tests/test_phase10_multimodal_alpha.py tests/test_phase11_tr_and_nse_quarterly.py tests/test_phase12_dual_cloud_state.py tests/test_tradebook_engine.py tests/test_durable_jobs_and_streaming.py tests/test_web_push_sync.py tests/test_telegram_bot.py -v

  frontend-quality:
    name: Next.js 14 Production Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript Type Check & Next.js Production Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npx tsc --noEmit
          npm run build
