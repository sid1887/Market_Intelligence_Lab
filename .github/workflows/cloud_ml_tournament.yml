name: Walk-Forward ML Tournament & Alpha Forecast Precomputation

on:
  schedule:
    # Twice on weekdays: 12:30 IST mid-session (07:00 UTC) + 16:30 IST EOD settlement (11:00 UTC)
    - cron: "0 7,11 * * 1-5"
    # Sunday evening full-horizon retrain at 18:00 IST (12:30 UTC)
    - cron: "30 12 * * 0"
  workflow_dispatch:

jobs:
  run-ml-tournament:
    name: 7GB Cloud Runner Walk-Forward ML Tournament
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Fast Worker Dependencies
        run: |
          pip install -r requirements-worker.txt

      - name: Execute Walk-Forward ML Tournament & 300-Stock Precomputation
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          INTERNAL_SYNC_TOKEN: ${{ secrets.INTERNAL_SYNC_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/cloud_worker.py --mode ml
